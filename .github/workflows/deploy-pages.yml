name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-build-spec-qi770o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # playwright is a dev dependency used only by the local test harnesses;
          # no need to pull ~200MB of browsers into the deploy job.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Validate the level
        run: npm run validate

      - name: Build
        run: npm run build
        env:
          # Project Pages serve from https://<owner>.github.io/<repo>/
          DEPLOY_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo if it isn't already, so this works without
          # anyone having to visit repo settings first.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
