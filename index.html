<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover  -> lets the page paint under the notch so env(safe-area-inset-*) reports real values
      user-scalable=no + maximum-scale=1 -> kills pinch-zoom and double-tap-zoom, which otherwise fire
      constantly during rapid tapping.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070d" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Inline favicon: avoids a 404 round-trip in the WebView. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 26 14 16 30 6 14Z' fill='%233fe0c8'/%3E%3C/svg%3E" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>Cave Runner</title>
    <style>
      :root {
        /* Safe-area insets, mirrored into custom properties so JS can read them.
           In landscape the notch/Dynamic Island lands on the LEFT or RIGHT edge. */
        --sa-top: env(safe-area-inset-top, 0px);
        --sa-right: env(safe-area-inset-right, 0px);
        --sa-bottom: env(safe-area-inset-bottom, 0px);
        --sa-left: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #cfe9ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        /* Gesture / selection locking: no pull-to-refresh, no rubber-band scroll,
           no text selection, no long-press callout, no tap highlight. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        /* 100% resolves against the layout viewport, which on iOS stays full height even
           while the browser chrome covers part of it — the canvas then fits an area that
           is partly off screen. dvh tracks the *visible* viewport; JS overrides this with
           a measured visualViewport height where one is reported. */
        height: 100%;
        height: 100dvh;
        touch-action: none;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      /* Hidden probe element: its computed padding resolves the env() values so JS
         can read real pixel insets (env() is not readable from getComputedStyle on :root
         reliably across WebViews). */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }

      /* Landscape-only: ask the player to rotate when the device is portrait. Inside
         #game so it still appears when the game is full screen. */
      #rotate-notice {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05070d;
        z-index: 20;
        text-align: center;
        padding: 24px;
      }

      #rotate-notice .glyph {
        width: 74px;
        height: 46px;
        border: 3px solid #3fe0c8;
        border-radius: 8px;
        box-shadow: 0 0 18px rgba(63, 224, 200, 0.55);
        animation: tilt 2s ease-in-out infinite;
      }

      #rotate-notice p {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8fb6cf;
      }

      @keyframes tilt {
        0%,
        45% {
          transform: rotate(90deg);
        }
        55%,
        100% {
          transform: rotate(0deg);
        }
      }

      @media (orientation: portrait) {
        #rotate-notice {
          display: flex;
        }
      }

      /* Full-screen toggle. Bottom-right, where a video player puts it — which is the
         mental model, and in landscape it lands in the pillarbox bar beside the canvas
         rather than on top of the game. Hidden by JS during a run. */
      #fullscreen-btn {
        position: absolute;
        /* Plain values first: if a browser cannot resolve env() through a custom property
           inside calc(), the calc below is dropped as invalid and these still place the
           button. Without the fallback that failure would strand it at its static
           position, in the top-left corner, over the score. */
        right: 12px;
        bottom: 12px;
        right: calc(var(--sa-right) + 12px);
        bottom: calc(var(--sa-bottom) + 12px);
        z-index: 15;

        display: flex;
        align-items: center;
        justify-content: center;
        /* 44px is the smallest reliable touch target on iOS. */
        width: 44px;
        height: 44px;
        padding: 0;

        border: 1px solid rgba(63, 224, 200, 0.4);
        border-radius: 10px;
        background: rgba(5, 7, 13, 0.72);
        color: #3fe0c8;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        cursor: pointer;
        /* `manipulation` still allows the tap; `none` on the ancestors would not. */
        touch-action: manipulation;
        transition: opacity 200ms ease;
      }

      /* During a run: still reachable — it is in the pillarbox bar, and taps on it cannot
         reach the game — but no longer competing with the game for attention. */
      #fullscreen-btn.is-playing {
        opacity: 0.45;
      }

      /* `display: flex` above would otherwise beat the `hidden` attribute. */
      #fullscreen-btn[hidden],
      #a2hs-hint[hidden] {
        display: none;
      }

      #fullscreen-btn svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #fullscreen-btn .icon-exit,
      #fullscreen-btn.is-fullscreen .icon-enter {
        display: none;
      }

      #fullscreen-btn.is-fullscreen .icon-exit {
        display: block;
      }

      /* The UA sizes a full-screen element itself; these just stop the page stylesheet
         from arguing with it. */
      #game:fullscreen,
      #game:-webkit-full-screen {
        width: 100%;
        height: 100%;
      }

      /* Shown only where the Fullscreen API is missing or refuses — iPhone Safari, whose
         route to a chrome-free game is the home screen instead. */
      #a2hs-hint {
        position: absolute;
        left: 50%;
        bottom: 12px;
        bottom: calc(var(--sa-bottom) + 12px);
        transform: translateX(-50%);
        z-index: 15;

        display: flex;
        align-items: center;
        gap: 12px;
        max-width: min(92vw, 440px);
        padding: 10px 14px;

        border: 1px solid rgba(63, 224, 200, 0.3);
        border-radius: 10px;
        background: rgba(5, 7, 13, 0.92);
        font-size: 12px;
        line-height: 1.35;
        color: #8fb6cf;
      }

      #a2hs-hint p {
        margin: 0;
      }

      #a2hs-hint b {
        color: #cfe9ff;
        font-weight: 600;
      }

      #a2hs-dismiss {
        flex: none;
        padding: 6px 10px;
        border: 1px solid rgba(63, 224, 200, 0.4);
        border-radius: 8px;
        background: transparent;
        color: #3fe0c8;
        font: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #4a6076;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-fallback">Loading…</div>
    <!--
      Everything that must stay visible *while full screen* lives inside #game, because
      #game is the element that goes full screen and only it and its descendants are
      painted in the browser's top layer. A sibling here is not merely behind the game —
      it is unreachable, pointer events included.
    -->
    <div id="game">
      <button id="fullscreen-btn" type="button" hidden aria-label="Enter full screen">
        <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        </svg>
        <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
        </svg>
      </button>
      <div id="a2hs-hint" hidden role="status">
        <p>For full screen, tap <b>Share</b> then <b>Add to Home Screen</b>.</p>
        <button id="a2hs-dismiss" type="button">Got it</button>
      </div>
      <div id="rotate-notice" role="alert">
        <div class="glyph"></div>
        <p>Rotate your device</p>
      </div>
    </div>
    <div id="safe-area-probe"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
