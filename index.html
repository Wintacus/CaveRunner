<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover  -> lets the page paint under the notch so env(safe-area-inset-*) reports real values
      user-scalable=no + maximum-scale=1 -> kills pinch-zoom and double-tap-zoom, which otherwise fire
      constantly during rapid tapping.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#05070d" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Inline favicon: avoids a 404 round-trip in the WebView. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 26 14 16 30 6 14Z' fill='%233fe0c8'/%3E%3C/svg%3E" />
    <title>Cave Runner</title>
    <style>
      :root {
        /* Safe-area insets, mirrored into custom properties so JS can read them.
           In landscape the notch/Dynamic Island lands on the LEFT or RIGHT edge. */
        --sa-top: env(safe-area-inset-top, 0px);
        --sa-right: env(safe-area-inset-right, 0px);
        --sa-bottom: env(safe-area-inset-bottom, 0px);
        --sa-left: env(safe-area-inset-left, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        color: #cfe9ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        /* Gesture / selection locking: no pull-to-refresh, no rubber-band scroll,
           no text selection, no long-press callout, no tap highlight. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: auto;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #game canvas {
        display: block;
        touch-action: none;
      }

      /* Hidden probe element: its computed padding resolves the env() values so JS
         can read real pixel insets (env() is not readable from getComputedStyle on :root
         reliably across WebViews). */
      #safe-area-probe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        visibility: hidden;
        pointer-events: none;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }

      /* Landscape-only: ask the player to rotate when the device is portrait. */
      #rotate-notice {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05070d;
        z-index: 20;
        text-align: center;
        padding: 24px;
      }

      #rotate-notice .glyph {
        width: 74px;
        height: 46px;
        border: 3px solid #3fe0c8;
        border-radius: 8px;
        box-shadow: 0 0 18px rgba(63, 224, 200, 0.55);
        animation: tilt 2s ease-in-out infinite;
      }

      #rotate-notice p {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8fb6cf;
      }

      @keyframes tilt {
        0%,
        45% {
          transform: rotate(90deg);
        }
        55%,
        100% {
          transform: rotate(0deg);
        }
      }

      @media (orientation: portrait) {
        #rotate-notice {
          display: flex;
        }
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #4a6076;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="boot-fallback">Loading…</div>
    <div id="game"></div>
    <div id="safe-area-probe"></div>
    <div id="rotate-notice" role="alert">
      <div class="glyph"></div>
      <p>Rotate your device</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
